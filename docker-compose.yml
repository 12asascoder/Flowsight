version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: water_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: water_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - water-net

  redis:
    image: redis:alpine
    container_name: water_cache
    ports:
      - "6379:6379"
    networks:
      - water-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: water_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - water-net

networks:
  water-net:
    driver: bridge

volumes:
  pgdata:
